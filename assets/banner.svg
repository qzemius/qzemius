
<svg width="420" height="100" viewBox="0 0 420 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="star" x1="0" y1="0" x2="70" y2="70">
      <stop stop-color="#DEF1FF"/>
      <stop offset="1" stop-color="#428FD0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(210 50)">
    <g transform="translate(-111 0)" filter="url(#glow)">
      <path d="M0 -35 L8 -9 L35 0 L8 8 L0 35 L-8 8 L-35 0 L-8 -9 Z"
        fill="url(#star)">
        <animateTransform attributeName="transform"
          type="rotate" from="0" to="360"
          dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity"
          values="0.7;1;0.7" dur="3s"
          repeatCount="indefinite"/>
      </path>
    </g>

    <text x="30" y="12"
      text-anchor="middle"
      fill="#F0F6FC"
      font-family="IBM Plex Mono, monospace"
      font-size="39"
      font-weight="600"
      letter-spacing="5">
      ZEMIUS
    </text>
  </g>
</svg>
